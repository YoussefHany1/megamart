"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build.environment]
  # Next.js intentionally inlines NEXT_PUBLIC_* values into client-side bundles,
  # so Netlify's secret scanner will always find them there. These keys are
  # public by design; omit them from scanning. STRIPE_SECRET_KEY stays protected.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_EMAILJS_PUBLIC_KEY,NEXT_PUBLIC_EMAILJS_SERVICE_ID,NEXT_PUBLIC_EMAILJS_TEMPLATE_ID,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
